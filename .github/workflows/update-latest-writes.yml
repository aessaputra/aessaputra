name: Update Latest Writes
run-name: "📝 Update Latest Writes by @${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_latest_writes.py'
      - '.github/workflows/update-latest-writes.yml'
  schedule:
    - cron: '0 0 * * 0'  # Setiap hari Minggu pukul 00:00 UTC
  workflow_dispatch:

# Mencegah race conditions dengan concurrency control
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  update-latest-writes:
    name: Update README Latest Writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Update README with latest activity
        run: python .github/scripts/update_latest_writes.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update latest writes"
          file_pattern: README.md
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
